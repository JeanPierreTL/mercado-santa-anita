name: CI - Build, Test y Seguridad

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 1. Build (verificar código)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar que todos los .js compilen
        run: npm run lint

  test:
    name: 2. Test (pruebas automatizadas)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas unitarias y de integración
        run: npm test
      - name: Generar reporte JUnit
        if: always()
        run: npm run test:ci
      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: test-results.xml

  secrets:
    name: 3a. Seguridad - Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: 3b. Seguridad - Análisis de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

  fs-scan:
    name: 3c. Seguridad - Escaneo del repositorio (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (vulnerabilidades, secretos y configuraciones graves)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.57.1 fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /repo
